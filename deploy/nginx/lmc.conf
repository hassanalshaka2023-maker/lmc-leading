# Server block for the LMC site, for the VPS's OWN Nginx (not a container).
# This server also hosts other sites, so nothing here is a default_server.
#
#   cp deploy/nginx/lmc.conf /etc/nginx/sites-available/lmc
#   ln -s /etc/nginx/sites-available/lmc /etc/nginx/sites-enabled/lmc
#   nginx -t && systemctl reload nginx
#
# Then let Certbot add the TLS block:
#   certbot --nginx -d DOMAIN_PLACEHOLDER
server {
  listen 80;
  listen [::]:80;
  server_name DOMAIN_PLACEHOLDER;

  # Swagger is not for the public internet.
  location /api/docs { return 404; }

  # API — the NestJS container (published on localhost only).
  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Uploaded media — served from the backend's disk volume.
  location /uploads/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Everything else — the built React site.
  location / {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Headroom over MAX_UPLOAD_MB=5 so Multer, not Nginx, returns the error.
  client_max_body_size 10m;
}
