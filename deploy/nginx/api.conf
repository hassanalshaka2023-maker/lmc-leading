# STEP 1 — HTTP only. Lets Certbot answer the ACME challenge and lets you smoke
# test the API before TLS exists. Replace API_DOMAIN_PLACEHOLDER (see DEPLOY.md).
# After the certificate is issued, swap this file for api-ssl.conf.template.
server {
  listen 80;
  server_name API_DOMAIN_PLACEHOLDER;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Headroom over MAX_UPLOAD_MB=5 so Multer, not Nginx, returns the error.
  client_max_body_size 10m;
}
